name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Static checks
        run: go vet ./...
      - name: Race and integration tests
        shell: bash
        run: go test -race -count=1 -timeout=120s '-coverprofile=coverage.out' ./...
      - name: Frontend regression tests
        run: node --test internal/web/frontend.test.cjs
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
  package:
    name: Package (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: amd64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build and checksum
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          mkdir -p dist
          name="lanchat-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then name="${name}.exe"; fi
          go build -trimpath -ldflags='-s -w' -o "dist/$name" .
          cp README.md dist/
          cd dist
          sha256sum "$name" > SHA256SUMS
          tar -czf "../${name%.exe}.tar.gz" "$name" README.md SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lanchat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lanchat-*.tar.gz
          if-no-files-found: error
          retention-days: 14
